# SecureX Platform API — Render Blueprint
#
# Deploys the PostgreSQL-backed Platform API as a Render Web Service with a
# managed Render PostgreSQL database, plus a render-only placeholder for the
# specialized downstream services (Blockchain + Fraud Engine live in separate
# repos/services and are wired in via env vars).
#
# Apply with:  render blueprint launch  (or "New +" -> Blueprint in the dashboard)

databases:
  - name: securex-postgres
    plan: free
    databaseName: securex
    user: securex

services:
  - type: web
    name: securex-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build:server && npm run build
    startCommand: node dist-server/index.js
    healthCheckPath: /api/health
    domains:
      - api-securex.sp-net.in
    envVars:
      - key: APP_ENV
        value: production
      - key: DATA_MODE
        value: real
      - key: HOST
        value: 0.0.0.0
      - key: NODE_ENV
        value: production
      # Never commit the shared development fallback; Render generates and
      # persists a strong secret below for the lifetime of the service.
      - key: JWT_SECRET
        generateValue: true
      # Exact allowed browser origins (Vercel frontends). No "*" is accepted.
      - key: CORS_ORIGINS
        value: https://app-securex.sp-net.in
      - key: DATABASE_URL
        fromDatabase:
          name: securex-postgres
          property: connectionString
      # Critical: seed only the first fresh database. Existing data (including
      # the schema_meta.seeded row) is never overwritten on re-deploys.
      - key: SEED_ON_BOOT
        value: "true"
      # Downstream services (separate securex repos). Point these at the
      # deployed endpoints.
      - key: BLOCKCHAIN_API_URL
        value: https://blockchain-securex.sp-net.in
      - key: FRAUD_ENGINE_URL
        value: https://fraud-securex.sp-net.in
      # Render auto-injects PORT; HOST above keeps it bound to 0.0.0.0.