<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SecureX Blockchain Explorer — public, read-only visibility into the SecureX trust infrastructure: blocks, transactions, validators and network status."
    />
    <!--
      The Explorer is a public, read-only surface. It is intentionally NOT a
      SecureX application surface: there is no login, no session, no wallet and
      no credential here, and no `robots` auth surface. The only backend it
      ever calls is the public read-only Platform API.
    -->
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /*
       * Apply the theme before first paint.
       *
       * Without this the document renders with the light tokens, and if the
       * visitor wants dark the whole page visibly flips once React mounts.
       * This script therefore mirrors the resolution rules in
       * src/explorer/theme/theme.ts — keep the two in step:
       *
       *   1. an explicit stored preference wins
       *   2. otherwise follow prefers-color-scheme
       *   3. otherwise light, the product default
       *
       * `theme-boot` suppresses colour transitions for this first paint.
       */
      (function () {
        try {
          var stored = window.localStorage.getItem('securex-explorer-theme');
          var prefersDark =
            typeof window.matchMedia === 'function' &&
            window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : prefersDark
                ? 'dark'
                : 'light';

          var root = document.documentElement;
          root.classList.add('theme-boot');
          if (theme === 'dark') root.classList.add('dark-theme');
          root.style.colorScheme = theme;

          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute('content', theme === 'dark' ? '#050505' : '#f8fafc');
          }

          // Release the transition lock on the next frame, once the correct
          // theme is already on screen.
          window.requestAnimationFrame(function () {
            root.classList.remove('theme-boot');
          });
        } catch (e) {
          // Storage or matchMedia unavailable: the light default in the
          // stylesheet is a safe landing.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>SecureX Blockchain Explorer</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="../src/explorer/main.tsx"></script>
  </body>
</html>
